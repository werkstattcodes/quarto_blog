project:
  type: website
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!_site/"
    - "!_freeze/"
    - "!.quarto/"
    - "!**/*_cache/"

website:
  title: "werk.statt.codes"
  site-url: https://werk.statt.codes
  description: "Blog on data analysis in R."
  cookie-consent:
      palette: dark
  google-analytics: UA-149910232-1
  back-to-top-navigation: false

  reader-mode: false
  
  page-footer: 
    right: 
      - text: "{{< fa brands orcid >}}" #text!
        href: https://orcid.org/0000-0002-6897-1693
      - icon: github
        href: https://github.com/werkstattcodes
      - text: "{{< fa brands bluesky >}}"
        aria-label: bluesky
        href: https://bsky.app/profile/zoowalk.bsky.social
      - icon: rss
        href: index.xml
      - icon: envelope-plus
        href: subscribe.html

  search:
    type: overlay
    location: navbar

  navbar:
    right:
      - text: more
        menu:
          - about.qmd
          - text: "---"
          - text: "Packages"
          - text: "ParlAT"
            href: https://werkstattcodes.github.io/ParlAT/
            target: _blank
          - text: "risAT"
            href: https://werkstattcodes.github.io/risAT/
            target: _blank
    collapse: true
    pinned: true

# Default author
#author:
#  - name: Roland Schmidt
#    url: https://werk.statt.codes

format:
  html:
    theme:
      light: [litera, theme.scss]
      dark: [litera, theme-dark.scss]
    html-table-processing: none
    include-in-header:
      - text: |
          <script>
          // Apply saved theme preference immediately to prevent flash
          (function() {
            const saved = localStorage.getItem('quarto-color-scheme');
            if (saved === 'alternate') {
              document.documentElement.classList.add('quarto-dark');
            }
          })();
          </script>
    code-copy: true
    highlight-style: github
    fontsize: 16px
    # fontcolor: red
    toc: true
    toc-depth: 4
    toc-title: Contents
    toc-location: left
    code-fold: true
    fig-cap-location: top
    number-sections: true
    smooth-scroll: true

#editor: visual

date-format: D MMM YYYY

filters:
  - lightbox
lightbox: 
  match: auto  
  desc-position: bottom

# Default knitr options
execute:
  echo: true
  message: false
  warning: false
  freeze: true
